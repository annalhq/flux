global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: kafka
    static_configs: [{ targets: ["kafka-exporter:9308"] }]
  - job_name: clickhouse
    static_configs: [{ targets: ["clickhouse:9363"] }]
  - job_name: flink
    static_configs: [{ targets: ["flink-jobmanager:9249", "flink-taskmanager:9249"] }]
