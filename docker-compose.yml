name: flux

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-kafka-env: &kafka-env
  CLUSTER_ID: ${KAFKA_CLUSTER_ID:?set KAFKA_CLUSTER_ID in .env}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 900000
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"

x-kafka: &kafka
  <<: *service
  image: apache/kafka:3.7.0
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
    interval: 10s
    timeout: 10s
    retries: 10
    start_period: 30s
  deploy: { resources: { limits: { memory: 768m } } }

x-flink: &flink
  <<: *service
  build: { context: infra/flink }
  image: flux/flink:1.19.1
  depends_on:
    minio-init: { condition: service_completed_successfully }

x-flink-properties: &flink-properties |
  jobmanager.rpc.address: flink-jobmanager
  jobmanager.memory.process.size: 1024m
  taskmanager.memory.process.size: 2048m
  taskmanager.numberOfTaskSlots: 8
  taskmanager.memory.managed.fraction: 0.25
  env.java.opts.client: -Xmx256m
  state.backend.type: rocksdb
  state.backend.incremental: true
  state.checkpoints.dir: s3://flink-checkpoints/checkpoints
  state.savepoints.dir: s3://flink-checkpoints/savepoints
  execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
  s3.endpoint: http://minio:9000
  s3.access-key: ${MINIO_ROOT_USER}
  s3.secret-key: ${MINIO_ROOT_PASSWORD}
  s3.path.style.access: true
  metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
  metrics.reporter.prom.port: 9249
  rest.flamegraph.enabled: true

services:
  # ---------------------------------------------------------------- Kafka (KRaft x3)
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    ports: ["29092:29092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:29092
    volumes: [kafka-1-data:/var/lib/kafka/data]

  kafka-2:
    <<: *kafka
    hostname: kafka-2
    ports: ["29093:29093"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29093,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:29093
    volumes: [kafka-2-data:/var/lib/kafka/data]

  kafka-3:
    <<: *kafka
    hostname: kafka-3
    ports: ["29094:29094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:29094
    volumes: [kafka-3-data:/var/lib/kafka/data]

  schema-registry:
    <<: *service
    image: confluentinc/cp-schema-registry:7.6.0
    hostname: schema-registry
    ports: ["8081:8081"]
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP}
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx256m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy: { resources: { limits: { memory: 512m } } }

  # ---------------------------------------------------------------- Storage
  postgres:
    <<: *service
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_USER}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d nessie"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 256m } } }

  minio:
    <<: *service
    # pgsty/minio
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    ports: ["9001:9001", "9002:9000"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 512m } } }

  minio-init:
    image: pgsty/mc:RELEASE.2026-11-09T00-00-00Z
    restart: on-failure
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/flink-checkpoints local/warehouse
        echo "buckets ready"
    deploy: { resources: { limits: { memory: 128m } } }

  nessie:
    <<: *service
    image: ghcr.io/projectnessie/nessie:0.108.8
    ports: ["19120:19120"]
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      JAVA_OPTS_APPEND: "-Xmx256m"
      nessie.version.store.type: JDBC2
      nessie.version.store.persist.jdbc.datasource: postgresql
      quarkus.datasource.postgresql.jdbc.url: jdbc:postgresql://postgres:5432/nessie
      quarkus.datasource.postgresql.username: ${POSTGRES_USER}
      quarkus.datasource.postgresql.password: ${POSTGRES_PASSWORD}
      nessie.catalog.default-warehouse: ${ICEBERG_WAREHOUSE}
      nessie.catalog.warehouses.warehouse.location: s3://warehouse/
      nessie.catalog.service.s3.default-options.endpoint: http://minio:9000/
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.region: us-east-1
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog-secrets.access-key
      nessie.catalog-secrets.access-key.name: ${MINIO_ROOT_USER}
      nessie.catalog-secrets.access-key.secret: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9000/q/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy: { resources: { limits: { memory: 512m } } }

  # ---------------------------------------------------------------- Flink
  flink-jobmanager:
    <<: *flink
    hostname: flink-jobmanager
    command: jobmanager
    ports: ["8080:8081"]
    environment:
      FLINK_PROPERTIES: *flink-properties
    volumes: ["./flink/sql:/opt/flink/sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8081/overview >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy: { resources: { limits: { memory: 1536m } } }

  flink-taskmanager:
    <<: *flink
    command: taskmanager
    depends_on:
      flink-jobmanager: { condition: service_healthy }
    environment:
      FLINK_PROPERTIES: *flink-properties
    deploy: { resources: { limits: { memory: 2304m } } }

  # ---------------------------------------------------------------- Serving
  clickhouse:
    <<: *service
    image: clickhouse/clickhouse-server:24.3-alpine
    ports: ["8123:8123", "9000:9000"]
    environment:
      # Not CLICKHOUSE_PASSWORD: the image entrypoint would rewrite the default user.
      FLUX_CH_USER_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./infra/clickhouse/config/users.xml:/etc/clickhouse-server/users.d/flux-users.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -q 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy: { resources: { limits: { memory: 2g } } }

  # ---------------------------------------------------------------- Observability
  kafka-ui:
    <<: *service
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8090:8080"]
    depends_on:
      schema-registry: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: flux
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP}
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: ${SCHEMA_REGISTRY_URL}
      JAVA_OPTS: "-Xmx192m"
    deploy: { resources: { limits: { memory: 256m } } }

  kafka-exporter:
    <<: *service
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka-1:9092", "--kafka.server=kafka-2:9092", "--kafka.server=kafka-3:9092"]
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 128m } } }

  prometheus:
    <<: *service
    image: prom/prometheus:v2.51.0
    ports: ["9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:9090/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy: { resources: { limits: { memory: 512m } } }

  grafana:
    <<: *service
    image: grafana/grafana:10.4.0
    ports: ["3000:3000"]
    depends_on:
      clickhouse: { condition: service_healthy }
      prometheus: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.14.0
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy: { resources: { limits: { memory: 512m } } }

  # ---------------------------------------------------------------- Orchestration
  airflow:
    <<: *service
    build: { context: infra/airflow }
    image: flux/airflow:2.9.3
    ports: ["8082:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__WORKERS: 1
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      PYTHONPATH: /opt/airflow
      ICEBERG_REST_URI: ${ICEBERG_REST_URI}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    command: >
      bash -c "airflow db migrate &&
               (airflow users create -u admin -p $${AIRFLOW_ADMIN_PASSWORD} -f Flux -l Admin -r Admin -e admin@example.com || true) &&
               (airflow scheduler &) && exec airflow webserver"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/flux_recon:/opt/airflow/flux_recon
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:8080/health >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    deploy: { resources: { limits: { memory: 1536m } } }

  # ---------------------------------------------------------------- Ingestion
  producers:
    <<: *service
    profiles: ["producers"]
    build: { context: ., dockerfile: producers/Dockerfile }
    image: flux/producers:0.1.0
    ports: ["8000:8000"]
    env_file: [{ path: .env, required: false }]
    environment:
      PRODUCER_MODE: ${PRODUCER_MODE:-synthetic}
    depends_on:
      schema-registry: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy: { resources: { limits: { memory: 256m } } }

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  postgres-data:
  minio-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
