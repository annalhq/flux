[project]
name = "flux"
version = "0.1.0"
description = "Real-time crypto analytics platform: Kafka, Flink SQL, ClickHouse, Iceberg"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
producers = [
    "confluent-kafka[avro]==2.3.0",
    "fastavro==1.9.7",
    "websockets==12.0",
    "prometheus-client==0.21.1",
]
recon = [
    "pyiceberg[s3fs,pyarrow]==0.8.1",
    "duckdb==1.1.3",
    "clickhouse-connect==0.8.11",
]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.6",
    "fastavro==1.9.7",
    "pyyaml==6.0.2",
    "python-dotenv==1.0.1",
]

[tool.uv]
package = false
default-groups = ["dev", "producers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
pythonpath = ["producers", "."]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
